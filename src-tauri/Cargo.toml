[workspace]
members = ["quizlet_scraper", "cambridge_scraper"]

[package]
name = "teno"
version = "5.9.39"
description = "Teno — English vocabulary learning app"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "teno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
# tauri-plugin-single-instance disabled for dev
tokio = { version = "1", features = ["rt", "sync", "time"] }
ureq = { version = "2", default-features = false, features = ["gzip", "tls"] }
url = "2"
rodio = "0.19"
quizlet_scraper = { path = "quizlet_scraper" }
cambridge_scraper = { path = "cambridge_scraper" }
tauri-plugin-opener = "2.5.4"
fsrs = "=6.6.1"
rand = "0.9"
chrono = "0.4"
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15"
